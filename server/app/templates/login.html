<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Admin — Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #09090b;
            color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background-color: #121215;
            border: 1px solid #27272a;
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
            padding: 32px;
        }
        .header {
            margin-bottom: 24px;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #71717a;
            margin-top: 6px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a1a1aa;
            margin-bottom: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 4px;
            color: #fafafa;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus {
            border-color: #71717a;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #fafafa;
            color: #09090b;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn:hover {
            background-color: #e4e4e7;
        }
        .error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <div class="title">NEXUS // ADMIN</div>
            <div class="subtitle">Self-Hosted Server Management & Telemetry</div>
        </div>
        <div id="error-box" class="error"></div>
        <form id="login-form">
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="username" required autocomplete="username" placeholder="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Authenticate</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('error-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('nexus_token', data.access_token);
                    localStorage.setItem('nexus_user', JSON.stringify(data.user));
                    if (data.user.role === 'admin') {
                        window.location.href = '/dashboard';
                    } else {
                        errorBox.textContent = 'User account authenticated. Admin privilege required for Web Panel.';
                        errorBox.style.display = 'block';
                    }
                } else {
                    errorBox.textContent = data.detail || 'Authentication failed';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'Server connection error: ' + err.message;
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
