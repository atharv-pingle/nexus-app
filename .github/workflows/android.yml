name: Nexus Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Nexus APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Signed APK with Dynamic Versioning
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-v1.0.0.${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0.${{ github.run_number }}
          name: "Nexus v1.0.0.${{ github.run_number }}"
          body: |
            ### 🚀 Nexus Agentic Day Planner v1.0.0.${{ github.run_number }}
            
            - **Build Version:** `1.0.0.${{ github.run_number }}` (VersionCode: `${{ github.run_number }}`)
            - **Commit SHA:** `${{ github.sha }}`
            - **Device Compatibility:** Seamless in-place updates for Nothing Phone / Android 14+ (Signed with consistent V1-V3 keys).
            
            #### 📦 Included Features:
            - **Daily Orbit**: Dynamic Ultradian 75m/90m schedule with Parkinson rebalancing.
            - **Transition Interceptor**: 15:30 work-to-life 20m power nap / NSDR timer.
            - **Voice-First Interaction**: Hands-free agent mode via bottom center mic.
            - **Nightly Architect**: OpenRouter-driven next-day generation & habit telemetry.
            - **Anti-Slop UI**: High-contrast minimal typography.
            
            #### 📲 Installation on Nothing Phone:
            Download and install the APK below directly. Future updates will replace and upgrade smoothly with zero parse or signature errors!
          files: |
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
